{{ define "title" }}{{ .Title }} - Pro-Property{{ end }}
{{ define "content" }}
<div class="top-bar">
    <h1>{{ .Title }}</h1>
    <a href="/agent/estate/{{ .Plot.EstateID }}?status=available" class="edit-btn" style="background:#6b7280;">← Back</a>
</div>

<div class="card" style="max-width:640px;">
    <h3 style="margin:0 0 16px;font-size:16px;">{{ .Plot.EstateName }} — Plot {{ .Plot.Number }}</h3>
    <form method="POST" onsubmit="return confirm('Confirm booking this plot?');">
        <label for="buyer_name">Buyer Name</label>
        <input type="text" id="buyer_name" name="buyer_name" required placeholder="Full name">

        <label for="buyer_phone">Buyer Phone</label>
        <input type="tel" id="buyer_phone" name="buyer_phone" required placeholder="+254 700 000 000">

        <label for="buyer_email">Buyer Email</label>
        <input type="email" id="buyer_email" name="buyer_email" placeholder="Optional">

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3" placeholder="Optional notes about the booking"></textarea>

        <button type="submit" style="margin-top:14px;background:#16a34a;">✅ Confirm Booking</button>
    </form>
</div>
{{ end }}
{{ template "agent_base" . }}
