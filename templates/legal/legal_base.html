{{ define "legal_base" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ block "title" . }}Legal{{ end }}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        :root {
            --leg-primary: #b45309;
            --leg-dark:    #92400e;
            --leg-sidebar: #78350f;
            --leg-hover:   #92400e;
            --leg-light:   #fef3c7;
        }
        .sidebar { background: var(--leg-sidebar) !important; }
        .sidebar .logo-container h2 { color: #fff; }
        .sidebar ul li a { color: #fcd34d; }
        .sidebar ul li a:hover,
        .sidebar ul li a.active {
            background: var(--leg-hover) !important;
            color: #fff !important;
        }
        .sidebar-back-link {
            display: flex; align-items: center; gap: 7px;
            padding: 8px 12px; border-radius: 8px;
            font-size: 13px; color: #fcd34d;
            margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.2);
            text-decoration: none; transition: background 0.15s;
        }
        .sidebar-back-link:hover { background: var(--leg-hover); color: #fff; }
        .sidebar-module-tag {
            font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
            text-transform: uppercase; color: #fcd34d; margin-bottom: 6px;
            display: block; padding: 0 12px;
        }
        .sidebar-logout-btn {
            width: 100%; text-align: left; background: none;
            border: 1px solid rgba(255,255,255,0.2); color: #fcd34d;
            padding: 8px 14px; border-radius: 8px; cursor: pointer;
            font-size: 13px; transition: background 0.15s;
        }
        .sidebar-logout-btn:hover { background: var(--leg-hover); color: #fff; }

        .stat-card {
            background: #fff; border-radius: 14px; padding: 20px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex; flex-direction: column; gap: 4px;
        }
        .stat-card .stat-label { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
        .stat-card .stat-value { font-size: 24px; font-weight: 800; color: #0f172a; }

        .rv-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        .rv-table th { background: #f8fafc; color: #64748b; font-weight: 700; font-size: 11px;
            text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 14px; border-bottom: 2px solid #e2e8f0; }
        .rv-table td { padding: 11px 14px; border-bottom: 1px solid #f1f5f9; color: #1e293b; vertical-align: middle; }
        .rv-table tbody tr:hover { background: #fafafa; }

        .btn-primary {
            background: var(--leg-primary); color: #fff;
            border: none; padding: 8px 18px; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: background 0.15s; text-decoration: none; display: inline-block;
        }
        .btn-primary:hover { background: var(--leg-dark); color: #fff; }
        .btn-ghost {
            background: #f1f5f9; color: #475569;
            border: none; padding: 7px 14px; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: background 0.15s; text-decoration: none; display: inline-block;
        }
        .btn-ghost:hover { background: #e2e8f0; }
        .btn-danger {
            background: #fef2f2; color: #dc2626;
            border: none; padding: 8px 18px; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: background 0.15s;
        }
        .btn-danger:hover { background: #fee2e2; }

        .alert {
            padding: 11px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 16px;
        }
        .alert-error { background: #fee2e2; color: #dc2626; }

        .page-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
        }
        .page-header h1 { font-size: 20px; font-weight: 800; color: #0f172a; margin: 0; }
        .page-header p  { font-size: 13px; color: #64748b; margin: 4px 0 0; }

        .review-section { background:#fff; border-radius:14px; padding:20px 24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); margin-bottom:20px; }
        .review-section h3 { font-size:14px; font-weight:700; color:#1e293b; margin:0 0 14px; }
        .review-field { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f1f5f9; font-size:13.5px; }
        .review-field:last-child { border-bottom:none; }
        .review-field span:first-child { color:#64748b; font-weight:600; }
        .file-chip {
            display:inline-block; max-width:100%; box-sizing:border-box;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle;
            background:#f8fafc; border:1px solid #e2e8f0; border-radius:7px; padding:6px 12px; font-size:12.5px; color:#92400e; text-decoration:none; margin:0 6px 6px 0;
        }
        .file-chip:hover { background:#fffbeb; }
    </style>
</head>
<body>

<button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('sidebar--open')">☰ Menu</button>

<div class="sidebar">
    <div class="logo-container">
        <img src="/static/img/logo.png" alt="Pro-Property Logo" class="logo" onerror="this.style.display='none'">
        <h2>Legal</h2>
    </div>
    <a href="/hub" class="sidebar-back-link">&#8592; Back to Hub</a>
    <span class="sidebar-module-tag">Legal</span>
    <ul>
        <li><a href="/legal/queue" {{ if eq .Active "queue" }}class="active"{{ end }}>Pending Drafting</a></li>
        <li><a href="/legal/awaiting-signature" {{ if eq .Active "awaiting" }}class="active"{{ end }}>Pending Client Signature</a></li>
        <li><a href="/legal/completed" {{ if eq .Active "completed" }}class="active"{{ end }}>Completed Sale Agreement</a></li>
        <li><a href="/legal/estates" {{ if eq .Active "estates" }}class="active"{{ end }}>My Estates</a></li>
    </ul>
    <div style="padding:8px 12px; margin-top:auto;">
        <form action="/logout" method="post" style="margin:0">
            <button type="submit" class="sidebar-logout-btn">Logout</button>
        </form>
    </div>
</div>

<div class="main">
    {{ block "content" . }}{{ end }}
</div>

<script>
        // Shared attachment viewer: each attachment shows a "⋮" trigger that opens a
        // small menu with View / Download. View opens a modal that previews the file
        // (image or PDF) inline with an obvious "✕ Close" -- click outside or Escape
        // also close it -- instead of relying on a browser tab. This same script is
        // inlined at the bottom of every *_base.html (admin/agent/accounts/legal) so
        // it never depends on a separate static-file request succeeding.
        (function () {
            function buildModal() {
                if (document.getElementById('fv-modal')) return;
                var modal = document.createElement('div');
                modal.id = 'fv-modal';
                modal.className = 'fv-modal';
                modal.innerHTML =
                    '<div class="fv-modal-box">' +
                        '<div class="fv-modal-header">' +
                            '<span class="fv-modal-title" id="fv-modal-title"></span>' +
                            '<div class="fv-modal-actions">' +
                                '<a id="fv-modal-download" class="fv-modal-download" href="#" download>⬇ Download</a>' +
                                '<button type="button" class="fv-modal-close" id="fv-modal-close-btn">✕ Close</button>' +
                            '</div>' +
                        '</div>' +
                        '<div class="fv-modal-body" id="fv-modal-body"></div>' +
                    '</div>';
                document.body.appendChild(modal);
                modal.addEventListener('click', function (e) {
                    if (e.target === modal) closeFileViewer();
                });
                document.getElementById('fv-modal-close-btn').addEventListener('click', closeFileViewer);
            }

            window.openFileViewer = function (url, filename) {
                closeFileMenu();
                buildModal();
                document.getElementById('fv-modal-title').textContent = filename || 'File';
                var dl = document.getElementById('fv-modal-download');
                dl.href = url;
                dl.setAttribute('download', filename || '');

                var ext = (filename || url).split('.').pop().toLowerCase().split('?')[0];
                var isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].indexOf(ext) !== -1;
                var isPDF = ext === 'pdf';
                var body = document.getElementById('fv-modal-body');
                if (isImage) {
                    body.innerHTML = '<img src="' + url + '" alt="">';
                } else if (isPDF) {
                    body.innerHTML = '<iframe src="' + url + '"></iframe>';
                } else {
                    body.innerHTML =
                        '<div style="padding:40px;text-align:center;color:#64748b;font-size:13px;">' +
                        'Preview not available for this file type.<br><br>' +
                        '<a href="' + url + '" target="_blank" style="color:#2563eb;font-weight:600;">Open in a new tab instead</a></div>';
                }
                document.getElementById('fv-modal').classList.add('open');
                document.body.style.overflow = 'hidden';
            };

            window.closeFileViewer = function () {
                var modal = document.getElementById('fv-modal');
                if (modal) modal.classList.remove('open');
                document.body.style.overflow = '';
            };

            function fvMenuOutsideClick(e) {
                var menu = document.getElementById('fv-menu');
                if (menu && !menu.contains(e.target)) closeFileMenu();
            }

            window.closeFileMenu = function () {
                var menu = document.getElementById('fv-menu');
                if (menu) menu.remove();
                document.removeEventListener('click', fvMenuOutsideClick);
            };

            window.openFileMenu = function (evt, url, filename) {
                evt.preventDefault();
                evt.stopPropagation();
                closeFileMenu();
                var btn = evt.currentTarget;
                var menu = document.createElement('div');
                menu.id = 'fv-menu';
                menu.className = 'fv-menu';
                menu.innerHTML =
                    '<button type="button" class="fv-menu-item" id="fv-menu-view">👁 View</button>' +
                    '<a class="fv-menu-item" href="' + url + '" download="' + (filename || '') + '">⬇ Download</a>';
                document.body.appendChild(menu);
                var rect = btn.getBoundingClientRect();
                var top = rect.bottom + window.scrollY + 4;
                var left = rect.left + window.scrollX;
                var menuWidth = 150;
                if (left + menuWidth > window.innerWidth - 8) left = Math.max(8, window.innerWidth - menuWidth - 8);
                menu.style.top = top + 'px';
                menu.style.left = left + 'px';
                document.getElementById('fv-menu-view').addEventListener('click', function () {
                    closeFileMenu();
                    openFileViewer(url, filename);
                });
                setTimeout(function () {
                    document.addEventListener('click', fvMenuOutsideClick);
                }, 0);
            };

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') { closeFileViewer(); closeFileMenu(); }
            });
        })();

    </script>

</body>
</html>
{{ end }}
